<style>
  :root{
    --bg:#12141A;
    --surface:#1B1E27;
    --surface-2:#232733;
    --border:#2A2E3A;
    --text:#F2F1EC;
    --muted:#8B90A0;
    --train:#FF7A45;
    --train-dim:#3A2A22;
    --food:#FFC857;
    --food-dim:#39311C;
    --yoga:#7FB8A4;
    --yoga-dim:#20302C;
    --progress:#8C9EFF;
    --progress-dim:#232C46;
    --danger:#FF5C7A;
    --radius:16px;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none;}
  html,body{height:100%; overscroll-behavior-y:none;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(88px + env(safe-area-inset-bottom));
    overflow-x:hidden;
    user-select:none;
    -webkit-user-select:none;
  }
  input,textarea{user-select:text; -webkit-user-select:text;}
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  button{font-family:inherit; cursor:pointer; border:none; transition:transform .1s ease, opacity .1s ease;}
  button:active{transform:scale(.95); opacity:.85;}
  a{text-decoration:none;}
  input,select,textarea{font-family:inherit; background:var(--surface-2); color:var(--text); border:1px solid var(--border); border-radius:12px; padding:13px 14px; font-size:15px; width:100%; appearance:none; -webkit-appearance:none;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--progress); outline-offset:1px;}
  select{
    background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238B90A0' stroke-width='2.5'%3e%3cpath d='M6 9l6 6 6-6'/%3e%3c/svg%3e");
    background-repeat:no-repeat; background-position:right 12px center; background-size:16px; padding-right:36px;
  }
  ::-webkit-scrollbar{display:none;}

  /* ---- Splash ---- */
  #splash{position:fixed; inset:0; background:var(--bg); z-index:999; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; transition:opacity .4s ease, visibility .4s ease;}
  #splash.hide{opacity:0; visibility:hidden; pointer-events:none;}
  #splash .splash-mark{width:64px; height:64px; border-radius:20px; background:var(--train-dim); display:flex; align-items:center; justify-content:center; animation:pulseMark 1.1s ease-in-out infinite;}
  #splash .splash-mark svg{width:32px; height:32px;}
  #splash .splash-name{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px; letter-spacing:.02em;}
  @keyframes pulseMark{0%,100%{transform:scale(1); opacity:1;} 50%{transform:scale(1.08); opacity:.85;}}

  /* ---- Page transition ---- */
  main{padding:0 20px 20px; animation:viewIn .28s cubic-bezier(.2,.8,.3,1);}
  @keyframes viewIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

  /* ---- App shell ---- */
  #app{max-width:520px; margin:0 auto; min-height:100vh; position:relative;}
  header.topbar{
    padding:calc(18px + env(safe-area-inset-top)) 20px 14px;
    position:sticky; top:0; z-index:10;
    background:linear-gradient(var(--bg) 75%, transparent);
  }
  header.topbar .eyebrow{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:600;}
  header.topbar h1{font-size:26px; font-weight:700; margin-top:2px;}

  /* ---- Bottom nav ---- */
  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:20;
    background:rgba(20,22,29,.85); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border-top:1px solid var(--border);
    display:flex; justify-content:space-around;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    max-width:520px; margin:0 auto;
  }
  nav.tabbar button{
    background:none; display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--muted); font-size:10px; font-weight:600; letter-spacing:.02em;
    padding:7px 6px 5px; border-radius:14px; flex:1;
  }
  nav.tabbar button svg{width:21px; height:21px; transition:transform .18s ease;}
  nav.tabbar button.active{color:var(--text); background:var(--surface-2);}
  nav.tabbar button.active svg{color:var(--active-color, var(--progress)); transform:translateY(-1px);}

  /* ---- Cards ---- */
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; margin-bottom:14px; box-shadow:0 8px 24px -12px rgba(0,0,0,.5);}
  .card-title{font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:600; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;}
  .row{display:flex; justify-content:space-between; align-items:center;}
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .grid-3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
  .pill{display:inline-block; padding:4px 10px; border-radius:99px; font-size:11px; font-weight:600; letter-spacing:.02em;}
  .btn{padding:14px 18px; border-radius:14px; font-weight:600; font-size:14.5px; text-align:center; display:inline-flex; align-items:center; justify-content:center; gap:8px;}
  .btn-primary{background:var(--train); color:#1A0F09; width:100%; box-shadow:0 8px 20px -8px rgba(255,122,69,.55);}
  .btn-ghost{background:var(--surface-2); color:var(--text); border:1px solid var(--border);}
  .btn-sm{padding:9px 13px; font-size:12.5px; border-radius:11px;}
  .btn-block{width:100%;}
  .quick-actions{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .quick-actions button{background:var(--surface-2); border:1px solid var(--border); border-radius:14px; padding:14px 4px; display:flex; flex-direction:column; align-items:center; gap:6px; color:var(--text); font-size:11px; font-weight:600;}
  .quick-actions button svg{width:18px;height:18px;}

  /* Rings */
  .rings-wrap{display:flex; align-items:center; gap:18px;}
  .ring-stat{flex:1;}
  .ring-stat .label{font-size:11.5px; color:var(--muted); font-weight:600;}
  .ring-stat .val{font-family:'JetBrains Mono',monospace; font-size:15px; font-weight:600; margin-top:2px;}
  .bar-track{height:7px; border-radius:99px; background:var(--surface-2); margin-top:6px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:99px;}

  .week-strip{display:flex; justify-content:space-between; margin-bottom:16px;}
  .day-dot{display:flex; flex-direction:column; align-items:center; gap:6px; font-size:10.5px; color:var(--muted); font-weight:600;}
  .dot{width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:2px solid var(--border); font-size:11px;}
  .dot.done{background:var(--train); border-color:var(--train); color:#1A0F09;}
  .dot.rest{background:var(--surface-2);}
  .dot.today{border-color:var(--progress);}

  .empty{color:var(--muted); font-size:13.5px; text-align:center; padding:18px 8px;}
  .list-item{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--border);}
  .list-item:last-child{border-bottom:none;}
  .badge{font-size:10.5px; background:var(--surface-2); color:var(--muted); padding:3px 8px; border-radius:6px; font-weight:600;}

  .tag-row{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:14px;}
  .tag{padding:9px 15px; border-radius:99px; background:var(--surface-2); color:var(--muted); font-size:12.5px; font-weight:600; border:1px solid var(--border);}
  .tag.active{background:var(--text); color:var(--bg); border-color:var(--text);}

  .search-box{position:relative; margin-bottom:14px;}

  .modal-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:50; display:flex; align-items:flex-end; animation:fadeIn .2s ease;}
  @keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
  .modal{background:var(--surface); width:100%; max-width:520px; margin:0 auto; border-radius:26px 26px 0 0; padding:14px 20px calc(22px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto; box-shadow:0 -20px 50px -20px rgba(0,0,0,.6); animation:sheetUp .3s cubic-bezier(.2,.9,.3,1);}
  @keyframes sheetUp{from{transform:translateY(30px); opacity:.5;} to{transform:translateY(0); opacity:1;}}
  .modal-handle{width:36px; height:4px; background:var(--border); border-radius:99px; margin:0 auto 16px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; color:var(--muted); font-weight:600; margin-bottom:6px;}
  .field-row{display:flex; gap:10px;}

  .exercise-row{display:flex; gap:12px; align-items:center; padding:13px 0; border-bottom:1px solid var(--border);}
  .exercise-row:last-child{border-bottom:none;}
  .ex-icon{width:44px; height:44px; border-radius:13px; background:var(--train-dim); color:var(--train); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0;}
  .ex-icon.yoga{background:var(--yoga-dim); color:var(--yoga);}
  .ex-meta{flex:1; min-width:0;}
  .ex-meta .name{font-weight:600; font-size:14.5px;}
  .ex-meta .sub{font-size:12px; color:var(--muted); margin-top:2px;}

  .video-btn{display:flex; align-items:center; gap:6px; color:var(--progress); font-size:12.5px; font-weight:600; background:var(--progress-dim); padding:9px 13px; border-radius:12px; white-space:nowrap;}

  .set-row{display:grid; grid-template-columns:28px 1fr 1fr 1fr 24px; gap:8px; align-items:center; margin-bottom:8px;}
  .set-row input{padding:9px 8px; text-align:center;}
  .set-num{font-size:12px; color:var(--muted); font-weight:600; text-align:center;}
  .del-set{color:var(--danger); font-size:16px; text-align:center;}

  canvas{width:100%; display:block;}

  .goal-header{background:linear-gradient(135deg, var(--train-dim), var(--surface)); border:1px solid var(--border);}
  .toast{position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:11px 18px; border-radius:12px; font-size:13.5px; font-weight:600; z-index:60; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  .section-title{font-size:20px; font-weight:700; margin:4px 0 14px;}
  .muted{color:var(--muted);}
  .small{font-size:12.5px;}
  a{color:var(--progress);}
</style>
</head>

/* =========================================================
   Track Me — personal fitness tracker
   Storage: window.storage (personal, non-shared) with
   graceful in-memory fallback if unavailable.
   ========================================================= */

// ---------- Storage layer ----------
// Priority: window.storage (when running inside Claude) -> localStorage (standalone
// phone/PWA use, this is your own device, not the Claude.ai artifact sandbox) -> memory.
const Store = {
  mem: {},
  hasLocalStorage: (function(){
    try{ const k='__forge_test__'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }
    catch(e){ return false; }
  })(),
  async get(key, fallback){
    try{
      if(window.storage){
        const r = await window.storage.get(key);
        return r ? JSON.parse(r.value) : fallback;
      }
    }catch(e){ /* key not found in claude storage, fall through */ }
    if(this.hasLocalStorage){
      try{
        const raw = localStorage.getItem('forge:'+key);
        return raw !== null ? JSON.parse(raw) : fallback;
      }catch(e){ /* ignore */ }
    }
    return this.mem[key] !== undefined ? this.mem[key] : fallback;
  },
  async set(key, value){
    this.mem[key] = value;
    let savedRemote = false;
    try{
      if(window.storage){ await window.storage.set(key, JSON.stringify(value)); savedRemote = true; }
    }catch(e){ console.warn('claude storage set failed', e); }
    if(this.hasLocalStorage){
      try{ localStorage.setItem('forge:'+key, JSON.stringify(value)); }
      catch(e){ console.warn('localStorage set failed', e); }
    }
  }
};

function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short'}); }
function uid(){ return Math.random().toString(36).slice(2,10); }
function ytSearch(q){ return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

// ---------- Data: Indian & common food database (per given serving, approximate) ----------

// ---------- Nutrition / target math (Mifflin-St Jeor) ----------
function computeTargets(p){
  if(!p || !p.age || !p.height || !p.weight) return null;
  const w = p.weight, h = p.height, a = p.age;
  let bmr = p.gender === 'female'
    ? (10*w + 6.25*h - 5*a - 161)
    : (10*w + 6.25*h - 5*a + 5);
  const activityFactors = {sedentary:1.2, light:1.375, moderate:1.55, active:1.725, veryActive:1.9};
  const tdee = bmr * (activityFactors[p.activity] || 1.375);
  let calories = tdee;
  if(p.goal === 'muscle') calories = tdee + 350;
  else if(p.goal === 'fatloss') calories = tdee - 450;
  else if(p.goal === 'recomp') calories = tdee - 100;
  calories = Math.round(calories/10)*10;
  const proteinPerKg = p.goal === 'fatloss' ? 2.0 : 1.8;
  const protein = Math.round(w * proteinPerKg);
  const fatCals = calories * 0.25;
  const fat = Math.round(fatCals/9);
  const proteinCals = protein*4;
  const carbCals = Math.max(calories - proteinCals - fatCals, 0);
  const carbs = Math.round(carbCals/4);
  const water = Math.round((w * 35)/100)/10; // liters, ~35ml/kg
  return {bmr:Math.round(bmr), tdee:Math.round(tdee), calories, protein, carbs, fat, water};
}
function bmi(w,h){ if(!w||!h) return null; const m=h/100; return Math.round((w/(m*m))*10)/10; }

function switchTab(tab){
  if(tab===State.tab) return;
  State.tab = tab; render(); window.scrollTo(0,0);
  if(navigator.vibrate) navigator.vibrate(8);
}

function render(){
  const app = document.getElementById('app');
  if(!State.profile){ app.innerHTML = renderOnboarding(); attachOnboardingEvents(); return; }

  let body = '';
  if(State.tab === 'today') body = renderToday();
  else if(State.tab === 'train') body = renderTrain();
  else if(State.tab === 'nutrition') body = renderNutrition();
  else if(State.tab === 'yoga') body = renderYoga();
  else if(State.tab === 'progress') body = renderProgress();
  else if(State.tab === 'profile') body = renderProfile();

  app.innerHTML = `
    <header class="topbar">
      <div class="eyebrow">${headerEyebrow()}</div>
      <h1>${headerTitle()}</h1>
    </header>
    <main>${body}</main>

}

      ${ringRow('💧 Water', water/1000, targets.water, 'L', '#5AB0FF')}
    </div>` : `<div class="empty">Complete your profile to get personalized targets.</div>`}
  </div>

  <div class="card">
    <div class="card-title">Workout <span class="badge">${workoutToday ? 'Logged' : 'Not started'}</span></div>
    ${workoutToday ? `
      <div class="row"><div>
        <div style="font-weight:600">${workoutToday.dayPlan}</div>

      </div></div>
    ` : `<div class="empty" style="padding:8px 0 14px">No workout logged today.</div>
      <button class="btn btn-primary" onclick="switchTab('train')">Start Workout →</button>`}

  <div class="card">

    <div class="quick-actions">

function ringRow(label, val, target, unit, color){
  const pct = target ? clamp((val/target)*100,0,100) : 0;
  const v = unit==='L'||unit==='kcal' ? (unit==='L'? val.toFixed(1): Math.round(val)) : Math.round(val);
  return `
  <div class="ring-stat">
    <div class="row"><span class="label">${label}</span><span class="val mono">${v} / ${target}${unit==='L'?'L':unit}</span></div>
    <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
  </div>`;
}
function goalLabel(g){
  return {muscle:'Build Muscle', fatloss:'Fat Loss', recomp:'Body Recomposition', maintain:'Maintain & Perform'}[g] || 'General Fitness';
}
function computeStreak(){
  let streak=0; let d = new Date();
  for(;;){
    const iso = d.toISOString().slice(0,10);
    const active = State.workoutLogs.some(w=>w.date===iso) || State.yogaLogs.some(y=>y.date===iso);
    if(active){ streak++; d.setDate(d.getDate()-1); } else break;
  }
  return streak;
}

// ================= PROGRESS =================
function renderProgress(){
  const w = State.weightLogs.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const latest = w[w.length-1];
  const first = w[0];
  const change = latest && first ? (latest.kg-first.kg).toFixed(1) : null;
  const m = State.measureLogs.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const latestM = m[m.length-1];
  const firstM = m[0];

  return `
  <div class="card">
    <div class="card-title">Weight Trend <button class="btn btn-ghost btn-sm" onclick="openWeightModal()">+ Log</button></div>
    ${w.length>=1 ? `
      <canvas id="weight-chart" height="140"></canvas>
      <div class="grid-3" style="margin-top:12px">
        <div><div class="muted small">Current</div><div class="mono" style="font-weight:700">${latest.kg} kg</div></div>
        <div><div class="muted small">Change</div><div class="mono" style="font-weight:700;color:${change>0?'var(--train)':'var(--yoga)'}">${change>0?'+':''}${change??'—'} kg</div></div>
        <div><div class="muted small">BMI</div><div class="mono" style="font-weight:700">${bmi(latest.kg, State.profile.height)??'—'}</div></div>
      </div>
    ` : `<div class="empty">Log your weight to see trends.</div>`}
  </div>

  <div class="card">
    <div class="card-title">Body Measurements (cm) <button class="btn btn-ghost btn-sm" onclick="openMeasureModal()">+ Log</button></div>
    ${latestM ? `
      <div class="grid-2">
        ${['chest','waist','arm','thigh','shoulder','neck','calf'].filter(k=>latestM[k]).map(k=>`
          <div class="list-item" style="border:none;padding:6px 0">
            <span class="muted small" style="text-transform:capitalize">${k}</span>
            <span class="mono">${firstM && firstM[k] ? firstM[k]+' → ' : ''}${latestM[k]}</span>
          </div>`).join('')}
      </div>
    ` : `<div class="empty">No measurements logged yet.</div>`}
  </div>

  <div class="card">
    <div class="card-title">This Week's Report</div>
    ${renderWeeklyReport()}
  </div>
  `;
}
function renderWeeklyReport(){
  const now = new Date();
  const weekAgo = new Date(now); weekAgo.setDate(now.getDate()-7);
  const inWeek = (d)=> new Date(d) >= weekAgo;
  const workouts = State.workoutLogs.filter(w=>inWeek(w.date)).length;
  const yogaSessions = State.yogaLogs.filter(y=>inWeek(y.date)).length;
  const targets = computeTargets(State.profile);
  const mealsInWeek = State.mealLogs.filter(m=>inWeek(m.date));
  const daysWithMeals = new Set(mealsInWeek.map(m=>m.date)).size || 1;
  const avgProtein = Math.round(mealsInWeek.reduce((s,m)=>s+m.protein,0)/daysWithMeals);
  const proteinPct = targets ? Math.round((avgProtein/targets.protein)*100) : null;

  return `
    <div class="list-item"><span class="muted small">Workouts</span><span class="mono">${workouts} sessions</span></div>
    <div class="list-item"><span class="muted small">Yoga / Recovery</span><span class="mono">${yogaSessions} sessions</span></div>
    <div class="list-item"><span class="muted small">Avg. daily protein</span><span class="mono">${avgProtein||0}g ${proteinPct?'('+proteinPct+'%)':''}</span></div>
    <div class="small muted" style="margin-top:10px">${workouts>=3 ? '✓ Solid training consistency this week.' : '⚠ Try to hit at least 3-4 sessions next week.'}</div>
  `;
}

function openWeightModal(){
  const modal = document.getElementById('modal-root');
  modal.innerHTML = `
  <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-handle"></div>
      <h3 style="margin-bottom:14px">Log Weight</h3>
      <div class="field"><label>Weight (kg)</label><input id="wm-kg" type="number" step="0.1" placeholder="e.g. 65.4" value="${State.profile.weight||''}"></div>
      <button class="btn btn-primary btn-block" onclick="saveWeight()">Save</button>
      <button class="btn btn-ghost btn-block" style="margin-top:10px" onclick="closeModal()">Cancel</button>
    </div>
  </div>`;
}
async function saveWeight(){
  const kg = parseFloat(document.getElementById('wm-kg').value);
  if(!kg){ toast('Enter a valid weight'); return; }
  State.weightLogs.push({id:uid(), date:todayISO(), kg});
  State.profile.weight = kg;
  await Store.set('weight-logs', State.weightLogs);
  await Store.set('profile', State.profile);

  setTimeout(drawWeightChart, 50);
}
function openMeasureModal(){
  const modal = document.getElementById('modal-root');
  const fields = [['chest','Chest'],['waist','Waist'],['arm','Arm'],['thigh','Thigh'],['shoulder','Shoulder'],['neck','Neck'],['calf','Calf']];
  modal.innerHTML = `
  <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-handle"></div>
      <h3 style="margin-bottom:14px">Log Measurements (cm)</h3>
      ${fields.map(([k,l])=>`<div class="field"><label>${l}</label><input id="mm-${k}" type="number" step="0.1"></div>`).join('')}
      <button class="btn btn-primary btn-block" onclick="saveMeasurements()">Save</button>
      <button class="btn btn-ghost btn-block" style="margin-top:10px" onclick="closeModal()">Cancel</button>
    </div>
  </div>`;
}
async function saveMeasurements(){
  const fields = ['chest','waist','arm','thigh','shoulder','neck','calf'];
  const entry = {id:uid(), date:todayISO()};
  fields.forEach(k=>{ const v = parseFloat(document.getElementById('mm-'+k).value); if(v) entry[k]=v; });
  State.measureLogs.push(entry);
  await Store.set('measure-logs', State.measureLogs);
  closeModal(); toast('Measurements saved'); render();
}

function drawWeightChart(){
  const c = document.getElementById('weight-chart');
  if(!c) return;
  const w = State.weightLogs.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(-20);
  if(w.length<2) return;
  const dpr = window.devicePixelRatio||1;
  const rect = c.getBoundingClientRect();
  c.width = rect.width*dpr; c.height = 140*dpr;
  const ctx = c.getContext('2d');
  ctx.scale(dpr,dpr);
  const W = rect.width, H = 140, pad=10;
  const vals = w.map(x=>x.kg);
  const min = Math.min(...vals)-0.5, max = Math.max(...vals)+0.5;
  ctx.clearRect(0,0,W,H);
  ctx.beginPath();
  w.forEach((pt,i)=>{
    const x = pad + (i/(w.length-1))*(W-2*pad);
    const y = H-pad - ((pt.kg-min)/(max-min))*(H-2*pad);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.strokeStyle = '#FF7A45'; ctx.lineWidth=2.5; ctx.stroke();
  w.forEach((pt,i)=>{
    const x = pad + (i/(w.length-1))*(W-2*pad);
    const y = H-pad - ((pt.kg-min)/(max-min))*(H-2*pad);
    ctx.beginPath(); ctx.arc(x,y,3,0,7); ctx.fillStyle='#FF7A45'; ctx.fill();
  });
}

function openEditProfile(){ renderOnboardingModal(State.profile); }
function exportData(){
  const data = {profile:State.profile, weightLogs:State.weightLogs, measureLogs:State.measureLogs, workoutLogs:State.workoutLogs, mealLogs:State.mealLogs, waterLogs:State.waterLogs, yogaLogs:State.yogaLogs};
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});

  const a = document.createElement('a'); a.href=url; a.download='forge-fitness-data.json'; a.click();
  toast('Exported');
}
async function resetData(){
  if(!confirm('This clears all logs and profile. Continue?')) return;
  State.profile=null; State.weightLogs=[]; State.measureLogs=[]; State.workoutLogs=[]; State.mealLogs=[]; State.waterLogs=[]; State.yogaLogs=[];
  await Store.set('profile', null);
  await Store.set('weight-logs', []); await Store.set('measure-logs', []); await Store.set('workout-logs', []);
  await Store.set('meal-logs', []); await Store.set('water-logs', []); await Store.set('yoga-logs', []);

function setObField(field, value){ window.__ob[field]=value; renderObInner(); }
async function saveOnboarding(isEdit){
  const o = window.__ob;
  const profile = {
    name: o.name || 'Athlete',
    age: parseInt(o.age)||25,
    gender: o.gender,
    height: parseFloat(o.height)||170,
    weight: parseFloat(o.weight)||65,
    targetWeight: parseFloat(o.targetWeight)||null,
    goal: o.goal,
    activity: o.activity,
  };
  State.profile = profile;
  await Store.set('profile', profile);
  window.__ob = null;
  if(isEdit) closeModal();
  toast(isEdit?'Profile updated':'Welcome to Track Me 💪');
  State.tab='today';
  render();
}
